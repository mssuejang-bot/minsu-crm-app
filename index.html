<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0A0E14">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="영업 CRM">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<title>2026 영업 CRM</title>
<style>
  :root{
    --bg:#0a0e14; --panel:#111722; --panel-2:#161e2e; --border:#233046;
    --text:#e6edf3; --muted:#8b9bb4;
    --green:#3fb950; --cyan:#58a6ff; --yellow:#e3b341; --red:#f85149;
    --green-dim:rgba(63,185,80,.16); --cyan-dim:rgba(88,166,255,.15);
    --yellow-dim:rgba(227,179,65,.15); --red-dim:rgba(248,81,73,.16);
    --muted-dim:rgba(139,155,180,.12);
    --tab-h:58px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo",sans-serif;
    font-size:14px; line-height:1.45;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none;
  }
  input,button,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
  button{background:none;border:none;cursor:pointer}
  .app{max-width:600px;margin:0 auto;min-height:100vh;padding-bottom:calc(var(--tab-h) + env(safe-area-inset-bottom) + 12px)}

  /* ---------- top bar ---------- */
  .topbar{
    position:sticky;top:0;z-index:30;
    background:rgba(10,14,20,.94);
    -webkit-backdrop-filter:saturate(180%) blur(14px); backdrop-filter:saturate(180%) blur(14px);
    border-bottom:1px solid var(--border);
    padding:calc(env(safe-area-inset-top) + 12px) 16px 10px;
  }
  .tb-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .tb-title{font-size:17px;font-weight:700;letter-spacing:-.2px}
  .tb-sub{font-size:11.5px;color:var(--muted);margin-top:3px}
  .tb-sub b{color:var(--cyan);font-weight:600}
  .sync-pill{
    display:inline-flex;align-items:center;gap:5px;
    font-size:11px;font-weight:600;padding:5px 9px;border-radius:999px;
    background:var(--muted-dim);color:var(--muted);border:1px solid rgba(139,155,180,.25);
    white-space:nowrap;
  }
  .sync-pill.ok{background:var(--green-dim);color:var(--green);border-color:rgba(63,185,80,.35)}
  .sync-pill.warn{background:var(--yellow-dim);color:var(--yellow);border-color:rgba(227,179,65,.35)}
  .sync-pill.err{background:var(--red-dim);color:var(--red);border-color:rgba(248,81,73,.35)}
  .dot{width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block}
  .sync-pill.busy .dot{animation:pulse 1s infinite}
  @keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}

  /* ---------- stat tiles ---------- */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 16px 0}
  .stat{
    background:var(--panel);border:1px solid var(--border);border-radius:10px;
    padding:9px 10px 8px;
  }
  .stat-l{font-size:10.5px;color:var(--muted);margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stat-v{font-size:18px;font-weight:750;letter-spacing:-.4px}
  .stat.g .stat-v{color:var(--green)} .stat.c .stat-v{color:var(--cyan)}
  .stat.y .stat-v{color:var(--yellow)} .stat.m .stat-v{color:var(--muted)}

  /* ---------- search ---------- */
  .searchwrap{margin:12px 16px 0;position:relative}
  .searchwrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.5}
  #q{
    width:100%;padding:11px 36px 11px 36px;border-radius:11px;
    background:var(--panel);border:1px solid var(--border);color:var(--text);
    font-size:14px;outline:none;
  }
  #q::placeholder{color:#5e6b80}
  #q:focus{border-color:rgba(88,166,255,.5)}
  .clearq{position:absolute;right:8px;top:50%;transform:translateY(-50%);color:var(--muted);padding:6px 8px;font-size:15px;display:none}

  /* ---------- section head ---------- */
  .sec{display:flex;align-items:baseline;justify-content:space-between;margin:18px 16px 8px}
  .sec h2{font-size:13px;font-weight:700;color:var(--text)}
  .sec h2 span{color:var(--muted);font-weight:500;font-size:11.5px;margin-left:6px}
  .sec .link{font-size:11.5px;color:var(--cyan);font-weight:600}

  /* ---------- company card ---------- */
  .list{padding:0 16px;display:flex;flex-direction:column;gap:9px}
  .card{
    background:var(--panel);border:1px solid var(--border);border-radius:13px;
    padding:12px 12px 11px;
  }
  .card.done{opacity:.55}
  .c-top{display:flex;gap:10px;align-items:flex-start}
  .avatar{
    flex:0 0 38px;width:38px;height:38px;border-radius:11px;
    display:flex;align-items:center;justify-content:center;
    font-size:15px;font-weight:750;letter-spacing:-.5px;
    background:var(--cyan-dim);color:var(--cyan);border:1px solid rgba(88,166,255,.28);
  }
  .avatar.new{background:var(--cyan-dim);color:var(--cyan);border-color:rgba(88,166,255,.28)}
  .avatar.keep{background:var(--muted-dim);color:var(--muted);border-color:rgba(139,155,180,.25)}
  .c-mid{flex:1;min-width:0}
  .c-name{font-size:15px;font-weight:700;letter-spacing:-.2px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .c-name .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
  .tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
  .tag{font-size:10.5px;font-weight:650;padding:2.5px 7px;border-radius:999px;line-height:1.3;white-space:nowrap}
  .t-green{background:var(--green-dim);color:var(--green);border:1px solid rgba(63,185,80,.3)}
  .t-cyan{background:var(--cyan-dim);color:var(--cyan);border:1px solid rgba(88,166,255,.3)}
  .t-yellow{background:var(--yellow-dim);color:var(--yellow);border:1px solid rgba(227,179,65,.3)}
  .t-red{background:var(--red-dim);color:var(--red);border:1px solid rgba(248,81,73,.3)}
  .t-muted{background:var(--muted-dim);color:var(--muted);border:1px solid rgba(139,155,180,.25)}
  .c-sum{font-size:11.5px;color:var(--green);font-weight:600;margin-top:5px}
  .c-sum em{color:var(--muted);font-style:normal;font-weight:500}
  .c-loc{font-size:11px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .c-acts{display:flex;gap:6px;margin-top:10px}
  .btn{
    flex:1;padding:8px 6px;border-radius:9px;font-size:12px;font-weight:700;
    border:1px solid var(--border);background:var(--panel-2);color:var(--text);
    display:flex;align-items:center;justify-content:center;gap:4px;
    transition:transform .08s ease, filter .12s ease;
  }
  .btn:active{transform:scale(.97);filter:brightness(1.25)}
  .btn.done{color:var(--green);border-color:rgba(63,185,80,.35);background:var(--green-dim)}
  .btn.snooze{color:var(--yellow);border-color:rgba(227,179,65,.32);background:var(--yellow-dim)}
  .btn.open{color:var(--cyan);border-color:rgba(88,166,255,.32);background:var(--cyan-dim)}
  .btn.ghost{background:transparent;color:var(--muted)}
  .btn[disabled]{opacity:.4;pointer-events:none}

  /* ---------- empty ---------- */
  .empty{
    margin:0 16px;padding:26px 18px;text-align:center;
    background:var(--panel);border:1px dashed var(--border);border-radius:13px;
  }
  .empty .ic{font-size:26px;margin-bottom:8px;opacity:.75}
  .empty h3{font-size:14px;font-weight:700;margin-bottom:5px}
  .empty p{font-size:12px;color:var(--muted);line-height:1.55}

  /* ---------- chips ---------- */
  .chips{display:flex;gap:6px;padding:0 16px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{
    flex:0 0 auto;padding:6px 12px;border-radius:999px;font-size:12px;font-weight:650;
    background:var(--panel);border:1px solid var(--border);color:var(--muted);
  }
  .chip.on{background:var(--cyan-dim);border-color:rgba(88,166,255,.4);color:var(--cyan)}

  /* ---------- tabbar ---------- */
  .tabbar{
    position:fixed;left:0;right:0;bottom:0;z-index:40;
    background:rgba(17,23,34,.96);
    -webkit-backdrop-filter:saturate(180%) blur(16px);backdrop-filter:saturate(180%) blur(16px);
    border-top:1px solid var(--border);
    padding-bottom:env(safe-area-inset-bottom);
  }
  .tabbar-in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--tab-h)}
  .tab{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    color:#65718a;font-size:10.5px;font-weight:650;position:relative;
  }
  .tab svg{stroke-width:1.9}
  .tab.on{color:var(--cyan)}
  .tab.on::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:26px;height:2px;border-radius:0 0 3px 3px;background:var(--cyan)}
  .tab .dotb{position:absolute;top:8px;right:calc(50% - 16px);width:6px;height:6px;border-radius:50%;background:var(--yellow)}

  /* ---------- sheet / modal ---------- */
  body.noscroll{overflow:hidden}
  .veil{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:none;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
  .veil.on{display:block}
  .sheet{
    position:fixed;left:0;right:0;bottom:0;z-index:60;
    max-width:600px;margin:0 auto;
    background:var(--bg);border-top:1px solid var(--border);
    border-radius:18px 18px 0 0;
    max-height:94vh;display:flex;flex-direction:column;
    transform:translateY(101%);transition:transform .26s cubic-bezier(.22,1,.36,1);
    box-shadow:0 -12px 40px rgba(0,0,0,.55);
  }
  .sheet.on{transform:translateY(0)}
  .sheet-grip{width:36px;height:4px;border-radius:99px;background:#2b3852;margin:9px auto 0}
  .sheet-head{padding:10px 16px 8px;display:flex;align-items:center;gap:10px}
  .sheet-head .x{margin-left:auto;color:var(--muted);padding:6px;font-size:18px;line-height:1}
  .sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:0 16px calc(20px + env(safe-area-inset-bottom))}

  /* detail */
  .d-hero{display:flex;gap:12px;align-items:center;padding:4px 0 12px}
  .d-hero .avatar{width:50px;height:50px;flex-basis:50px;border-radius:14px;font-size:19px}
  .d-name{font-size:18px;font-weight:750;letter-spacing:-.3px;line-height:1.25}
  .d-quick{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:12px}
  .qbtn{
    background:var(--panel);border:1px solid var(--border);border-radius:11px;
    padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:5px;
    font-size:10.5px;font-weight:650;color:var(--text);
  }
  .qbtn svg{opacity:.85}
  .qbtn:active{filter:brightness(1.3)}
  .qbtn[disabled]{opacity:.35}
  .qbtn.g{color:var(--green)} .qbtn.c{color:var(--cyan)} .qbtn.y{color:var(--yellow)}
  .qbtn.g svg{stroke:var(--green)} .qbtn.c svg{stroke:var(--cyan)} .qbtn.y svg{stroke:var(--yellow)}

  .nextcard{
    background:var(--panel-2);border:1px solid var(--border);border-left:3px solid var(--cyan);
    border-radius:11px;padding:11px 12px;margin-bottom:12px;
  }
  .nextcard .lbl{font-size:10.5px;color:var(--cyan);font-weight:700;letter-spacing:.4px;margin-bottom:4px}
  .nextcard .txt{font-size:13.5px;font-weight:600;line-height:1.45}
  .nextcard .meta{font-size:11px;color:var(--muted);margin-top:5px}
  .nextcard .acts{display:flex;gap:6px;margin-top:10px}

  .dtab{display:flex;border-bottom:1px solid var(--border);margin-bottom:12px}
  .dtab button{flex:1;padding:9px 0;font-size:12.5px;font-weight:700;color:var(--muted);border-bottom:2px solid transparent}
  .dtab button.on{color:var(--cyan);border-bottom-color:var(--cyan)}

  .rows{background:var(--panel);border:1px solid var(--border);border-radius:12px;overflow:hidden}
  .row{display:flex;gap:10px;padding:11px 12px;border-bottom:1px solid rgba(35,48,70,.7);align-items:flex-start}
  .row:last-child{border-bottom:none}
  .row .k{flex:0 0 74px;font-size:11.5px;color:var(--muted);padding-top:1px}
  .row .v{flex:1;font-size:13px;font-weight:600;word-break:break-all;line-height:1.45}
  .row .v small{display:block;font-size:10.5px;color:var(--muted);font-weight:500;margin-top:2px}
  .row .v.mono{font-variant-numeric:tabular-nums}
  .row .cp{color:var(--muted);font-size:11px;padding:2px 4px;align-self:center}

  .act-item{display:flex;gap:9px;padding:10px 0;border-bottom:1px solid rgba(35,48,70,.7)}
  .act-item:last-child{border-bottom:none}
  .act-item .tb{font-size:10.5px;color:var(--muted);flex:0 0 62px;padding-top:1px}
  .act-item .tx{font-size:12.5px;line-height:1.5;flex:1;white-space:pre-wrap}

  /* forms */
  .field{margin-bottom:12px}
  .field label{display:block;font-size:11.5px;color:var(--muted);font-weight:650;margin-bottom:5px}
  .input,select,textarea{
    width:100%;padding:11px 12px;border-radius:10px;background:var(--panel);
    border:1px solid var(--border);color:var(--text);font-size:14px;outline:none;
  }
  .input:focus,select:focus,textarea:focus{border-color:rgba(88,166,255,.5)}
  textarea{resize:vertical;min-height:86px;line-height:1.5}
  .btnwide{
    width:100%;padding:13px;border-radius:12px;font-size:14px;font-weight:750;
    background:var(--cyan);color:#04121f;border:none;margin-top:4px;
  }
  .btnwide:active{filter:brightness(.92)}
  .btnwide.alt{background:var(--panel-2);color:var(--text);border:1px solid var(--border)}
  .btnwide.danger{background:transparent;color:var(--red);border:1px solid rgba(248,81,73,.4)}
  .hint{font-size:11.5px;color:var(--muted);line-height:1.6}
  .hint b{color:var(--text);font-weight:650}
  .hint a{color:var(--cyan);text-decoration:none}

  .setting-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:13px;margin-bottom:10px}
  .setting-card h3{font-size:12.5px;font-weight:700;margin-bottom:6px;display:flex;align-items:center;gap:6px}

  /* toast */
  .toast{
    position:fixed;left:50%;transform:translate(-50%,20px);bottom:calc(var(--tab-h) + env(safe-area-inset-bottom) + 14px);
    z-index:100;background:#1b2436;border:1px solid var(--border);border-radius:12px;
    padding:11px 14px;display:flex;align-items:center;gap:12px;
    box-shadow:0 10px 30px rgba(0,0,0,.5);font-size:12.5px;
    opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;
    max-width:calc(100% - 32px);
  }
  .toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
  .toast .undo{color:var(--cyan);font-weight:750;font-size:12.5px;padding:2px 2px;white-space:nowrap}
  .toast .msg{flex:1}

  .banner{
    margin:12px 16px 0;padding:11px 12px;border-radius:11px;font-size:12px;line-height:1.55;
    background:var(--yellow-dim);border:1px solid rgba(227,179,65,.35);color:var(--yellow);
    display:flex;gap:9px;align-items:flex-start;
  }
  .banner.red{background:var(--red-dim);border-color:rgba(248,81,73,.35);color:var(--red)}
  .banner.info{background:var(--cyan-dim);border-color:rgba(88,166,255,.30);color:var(--cyan)}
  .banner b{display:block;margin-bottom:2px}
  .banner .x{margin-left:auto;color:inherit;opacity:.7;padding:0 2px}

  .morebtn{display:block;width:calc(100% - 32px);margin:12px 16px 0;padding:12px;border-radius:11px;background:var(--panel);border:1px solid var(--border);color:var(--muted);font-size:12.5px;font-weight:650}
  .sched-group{margin-bottom:14px}
  .sched-date{font-size:11.5px;font-weight:700;color:var(--cyan);margin:0 16px 7px;display:flex;align-items:center;gap:6px}
  .kbd{font-size:10.5px;background:var(--panel-2);border:1px solid var(--border);border-radius:5px;padding:1px 5px;color:var(--muted)}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="tb-row">
      <div style="min-width:0">
        <div class="tb-title" id="tbTitle">2026 영업 CRM</div>
        <div class="tb-sub" id="tbSub">불러오는 중…</div>
      </div>
      <button class="sync-pill" id="syncPill" onclick="openSettings()"><span class="dot"></span><span id="syncTxt">대기</span></button>
    </div>
  </div>

  <div id="banners"></div>

  <!-- TODAY -->
  <section id="view-today">
    <div class="stats" id="stats"></div>
    <div class="searchwrap">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#8b9bb4" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="업체명 · 초성 · 지역 · 담당자" autocomplete="off" spellcheck="false">
      <button class="clearq" id="clearq" onclick="clearQ()">✕</button>
    </div>
    <div class="sec"><h2 id="todayHead">지금 확인할 기업</h2><button class="link" onclick="setTab('companies')">전체 195 →</button></div>
    <div class="list" id="todayList"></div>
    <button class="morebtn" id="moreBtn" style="display:none" onclick="moreToday()"></button>
  </section>

  <!-- COMPANIES -->
  <section id="view-companies" style="display:none">
    <div class="searchwrap" style="margin-bottom:10px">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#8b9bb4" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q2" type="search" placeholder="업체명 · 초성 · 지역 · 담당자" autocomplete="off" spellcheck="false">
      <button class="clearq" id="clearq2" onclick="clearQ()">✕</button>
    </div>
    <div class="chips" id="chips"></div>
    <div class="list" id="compList" style="margin-top:10px"></div>
    <button class="morebtn" id="moreBtn2" style="display:none" onclick="moreComp()"></button>
  </section>

  <!-- SCHEDULE -->
  <section id="view-sched" style="display:none">
    <div class="sec"><h2>일정 <span id="schedCount"></span></h2><button class="link" onclick="clearSched()">밀린 일정 정리</button></div>
    <div id="schedList"></div>
  </section>

  <!-- SETTINGS -->
  <section id="view-settings" style="display:none">
    <div class="sec"><h2>설정</h2></div>
    <div style="padding:0 16px">
      <div class="setting-card">
        <h3>🔗 데이터 연결</h3>
        <div class="hint" id="connInfo"></div>
        <div style="display:flex;gap:8px;margin-top:11px">
          <button class="btn open" style="flex:1" onclick="connectFlow()" id="connBtn">토큰 연결</button>
          <button class="btn ghost" style="flex:1" onclick="pullNow()" id="pullBtn">지금 새로고침</button>
        </div>
      </div>
      <div class="setting-card">
        <h3>📊 저장소</h3>
        <div class="hint" id="repoInfo"></div>
        <div style="margin-top:9px"><button class="btn ghost" style="width:100%" onclick="openRepoEdit()">저장소 주소 변경</button></div>
      </div>
      <div class="setting-card">
        <h3>💾 백업</h3>
        <div class="hint">데이터를 JSON 파일로 내려받거나, 파일로 복원할 수 있습니다.</div>
        <div style="display:flex;gap:8px;margin-top:11px">
          <button class="btn ghost" style="flex:1" onclick="exportJson()">내보내기</button>
          <label class="btn ghost" style="flex:1;margin:0">가져오기<input type="file" accept="application/json,.json" style="display:none" onchange="importJson(this)"></label>
        </div>
      </div>
      <div class="setting-card">
        <h3>⚙️ 앱 정보</h3>
        <div class="hint" id="appInfo"></div>
      </div>
      <button class="btnwide danger" onclick="disconnect()" id="disBtn" style="display:none">연결 해제 (토큰 삭제)</button>
      <div style="height:14px"></div>
    </div>
  </section>
</div>

<!-- TABBAR -->
<nav class="tabbar">

<script>
/* =========================================================
   2026 영업 CRM · mobile PWA
   - UI code only. No company data is stored in this file.
   - Data lives in the private repo and is fetched with the
     user's own fine-grained token (localStorage only).
   ========================================================= */

var DEFAULT_REPO = { owner:'mssuejang-bot', repo:'minsu-crm-data', path:'crm-data.json', branch:'main' };
var API = 'https://api.github.com';
var K = { token:'crm.token', doc:'crm.doc', repo:'crm.repo', meta:'crm.meta' };

var S = {
  token:'', doc:null, sha:'', repo:null,
  tab:'today', q:'', filter:'all', detailId:null, detailTab:'summary',
  todayLimit:10, compLimit:40,
  state:'idle',      // idle | sync | ok | err
  errMsg:'', lastSync:'', pending:0,
  skeleton:false
};

/* ---------- utils ---------- */
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function won(n){
  if(!n && n!==0) return '-';
  if(n>=100000000) return (n/100000000).toFixed(n>=1000000000?0:2).replace(/\.00$/,'')+'억';
  if(n>=10000) return Math.round(n/10000).toLocaleString()+'만';
  return n.toLocaleString();
}
function todayStr(d){
  d = d || new Date();
  var p=function(x){return (x<10?'0':'')+x;};
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());
}
function addDays(days){
  var d=new Date(); d.setDate(d.getDate()+days); return todayStr(d);
}
function dayLabel(ds){
  var t=todayStr();
  if(ds===t) return '오늘';
  if(ds===addDays(1)) return '내일';
  if(ds===addDays(2)) return '모레';
  if(ds===addDays(-1)) return '어제';
  var p=ds.split('-'); return (+p[1])+'월 '+(+p[2])+'일';
}
function timeAgo(iso){
  if(!iso) return '';
  var s=(Date.now()-new Date(iso).getTime())/1000;
  if(s<60) return '방금';
  if(s<3600) return Math.floor(s/60)+'분 전';
  if(s<86400) return Math.floor(s/3600)+'시간 전';
  return Math.floor(s/86400)+'일 전';
}
var CHO = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
function chosung(str){
  var out='';
  for(var i=0;i<str.length;i++){
    var c=str.charCodeAt(i);
    if(c>=0xAC00 && c<=0xD7A3) out+=CHO[Math.floor((c-0xAC00)/588)];
    else out+=str[i];
  }
  return out;
}
function firstChar(name){
  var n=(name||'').replace(/^\(주\)|^㈜|^주식회사\s*/,'').trim();
  return n ? n[0] : '·';
}
function shortName(n){ return (n||'').replace(/^\(주\)|^㈜|^주식회사\s*/,'').trim() || n; }

/* ---------- state persistence ---------- */
function saveLocal(){
  try{
    localStorage.setItem(K.doc, JSON.stringify(S.doc));
    localStorage.setItem(K.meta, JSON.stringify({sha:S.sha, lastSync:S.lastSync, repo:S.repo}));
  }catch(e){}
}
function loadLocal(){
  try{
    var d=localStorage.getItem(K.doc);
    if(d) S.doc=JSON.parse(d);
    var m=localStorage.getItem(K.meta);
    if(m){ var o=JSON.parse(m); S.sha=o.sha||''; S.lastSync=o.lastSync||''; S.repo=o.repo||S.repo; }
  }catch(e){}
  try{ S.token=localStorage.getItem(K.token)||''; }catch(e){ S.token=''; }
  try{ var r=localStorage.getItem(K.repo); if(r) S.repo=JSON.parse(r); }catch(e){}
  if(!S.repo) S.repo = JSON.parse(JSON.stringify(DEFAULT_REPO));
}

/* ---------- github api ---------- */
function ghHeaders(){
  return {
    'Authorization':'Bearer '+S.token,
    'Accept':'application/vnd.github+json',
    'X-GitHub-Api-Version':'2022-11-28'
  };
}
function b64ToUtf8(b64){
  var bin=atob(String(b64).replace(/\s/g,''));
  var bytes=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}
function utf8ToB64(str){
  var bytes=new TextEncoder().encode(str), bin='', CH=0x8000;
  for(var i=0;i<bytes.length;i+=CH){
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i+CH));
  }
  return btoa(bin);
}
function ghErr(res, body){
  var m = (body && body.message) || ('HTTP '+res.status);
  if(res.status===401) return '토큰이 유효하지 않습니다 (401). 토큰을 다시 넣어 주세요.';
  if(res.status===403) return '권한이 없습니다 (403). 토큰에 이 저장소의 Contents Read/Write 권한이 있는지 확인해 주세요.';
  if(res.status===404) return '저장소나 파일을 찾을 수 없습니다 (404). 저장소 이름과 토큰 권한을 확인해 주세요.';
  if(res.status===409) return '동시 수정 충돌 (409). 잠시 뒤 다시 시도합니다.';
  return m;
}
async function ghGetFile(){
  var r=S.repo;
  var url=API+'/repos/'+r.owner+'/'+r.repo+'/contents/'+encodeURIComponent(r.path).replace(/%2F/g,'/')+'?ref='+encodeURIComponent(r.branch);
  var res=await fetch(url,{headers:ghHeaders(),cache:'no-store'});
  var body=null;
  try{ body=await res.json(); }catch(e){}
  if(!res.ok){ var e1=new Error(ghErr(res, body)); e1.status=res.status; throw e1; }
  return { json: JSON.parse(b64ToUtf8(body.content)), sha: body.sha };
}
async function ghPutFile(doc, sha, message){
  var r=S.repo;
  var url=API+'/repos/'+r.owner+'/'+r.repo+'/contents/'+encodeURIComponent(r.path).replace(/%2F/g,'/');
  var payload={ message: message||'CRM 업데이트', content: utf8ToB64(JSON.stringify(doc,null,1)), branch:r.branch };
  if(sha) payload.sha=sha;
  var res=await fetch(url,{method:'PUT',headers:ghHeaders(),body:JSON.stringify(payload)});
  var body=null;
  try{ body=await res.json(); }catch(e){}
  if(!res.ok){ var err=new Error(ghErr(res,body)); err.status=res.status; throw err; }
  return body.content && body.content.sha ? body.content.sha : (body.commit && body.commit.sha) || sha;
}

/* ---------- sync engine ---------- */
var queue=[], pushTimer=null, pushing=false;

function setSync(state, msg){
  S.state=state;
  if(msg!==undefined) S.errMsg=msg;
  var pill=$('syncPill'), txt=$('syncTxt');
  pill.className='sync-pill';
  if(state==='sync'){ pill.classList.add('busy'); txt.textContent='저장 중'; }
  else if(state==='ok'){ pill.classList.add('ok'); txt.textContent= S.pending?('대기 '+S.pending):'동기화됨'; }
  else if(state==='err'){ pill.classList.add('err'); txt.textContent='오류'; }
  else { txt.textContent = S.token?'대기':'미연결'; }
  renderBanners();
}

function enqueue(op, args){
  queue.push({op:op, args:args});
  S.pending=queue.length;
  schedulePush();
}
function schedulePush(delay){
  clearTimeout(pushTimer);
  pushTimer=setTimeout(pushNow, delay||450);
}
async function pushNow(){
  if(!S.token){ setSync('idle'); return; }
  if(!S.doc) return;
  if(pushing) { schedulePush(800); return; }
  if(!queue.length){ setSync('ok'); return; }
  pushing=true; setSync('sync');
  var attempt=0;
  while(queue.length && attempt<3){
    attempt++;
    var ops=queue.slice();
    var doc=JSON.parse(JSON.stringify(S.doc));
    try{
      var sha = await ghPutFile(doc, S.sha, 'CRM 업데이트 · '+ops.map(function(o){return o.op;}).join(','));
      S.sha=sha;
      queue.splice(0, ops.length);
      S.pending=queue.length;
      S.lastSync=new Date().toISOString();
      saveLocal();
      setSync('ok');
    }catch(err){
      if(err.status===409){
        try{
          var fresh=await ghGetFile();
          var d=fresh.json;
          var touched={};
          ops.forEach(function(o){ if(typeof o.args==='string') touched[o.args]=true; });
          d.companies=(d.companies||[]).map(function(rc){
            var lc=(S.doc.companies||[]).filter(function(x){return x.id===rc.id;})[0];
            return (touched[rc.id]&&lc)?lc:rc;
          });
          S.doc=d; S.sha=fresh.sha;
        }catch(e2){ break; }
      } else {
        S.pending=queue.length;
        setSync('err', err.message);
        pushing=false;
        return;
      }
    }
  }
  pushing=false;
  if(queue.length) setSync('err','저장 대기 중 — 새로고침 후 다시 시도');
  else setSync('ok');
  renderAll();
}

async function pullNow(){
  if(!S.token){ connectFlow(); return; }
  setSync('sync');
  try{
    var got=await ghGetFile();
    var local=S.doc;
    if(local && got.json && got.json.updatedAt && local.updatedAt && local.updatedAt===got.json.updatedAt){
      /* same doc */
    }
    // preserve local-only operational fields that remote may not have (defensive merge on id)
    S.doc=got.json;
    S.sha=got.sha;
    S.lastSync=new Date().toISOString();
    saveLocal(); setSync('ok'); renderAll();
    toast('최신 데이터로 새로고침했습니다');
  }catch(err){
    setSync('err', err.message);
    toast('불러오기 실패: '+err.message);
  }
}

/* ---------- derived ---------- */
function companies(){ return (S.doc && S.doc.companies) || []; }
function byId(id){ return companies().filter(function(c){return c.id===id;})[0]; }
function isDoneToday(c){ return c.doneAt===todayStr(); }
function isDoneOn(c, d){ return c.doneAt===d; }
function isSnoozed(c){ return !!(c.dueDate && c.dueDate>todayStr()); }
function isOverdue(c){ return !!(c.dueDate && c.dueDate<todayStr() && !isDoneToday(c)); }

function score(c){
  var s=0;
  if(c.priority==='높음') s+=1000;
  else if(c.priority==='중간') s+=300;
  if(c.status==='제안 👀') s+=600;
  if(c.status==='협의중') s+=400;
  if(isOverdue(c)) s+=500;
  if(c.dueDate===todayStr()) s+=700;
  if(c.kind==='신규') s+=120;
  if(!c.lastContact) s+=60;
  s += Math.min(200, (c.expectedValue||0)/5000000);
  return s;
}
function todayList(){
  return companies().filter(function(c){ return !isDoneToday(c) && !isSnoozed(c); })
    .sort(function(a,b){ return score(b)-score(a); });
}
function match(c, q){
  if(!q) return true;
  var t=q.toLowerCase().replace(/\s+/g,'');
  if(t.replace(/[ㄱ-ㅎ]/g,'')==='' && /[ㄱ-ㅎ]/.test(t)) return chosung(shortName(c.name)).indexOf(t)>=0;
  var hay=[c.name, shortName(c.name), c.address, c.contact, c.phone, c.companyPhone, c.email, c.memo, c.status, c.kind, chosung(c.name)].join(' ').toLowerCase().replace(/\s+/g,'');
  return hay.indexOf(t)>=0;
}

function nextActionText(c){
  if(c.memo) return c.memo;
  if(isOverdue(c)) return '약속한 날짜가 지났습니다 — 오늘 바로 연락';
  if(c.status==='제안 👀') return '제안 회신 확인 — 3일 내 재연락';
  if(c.status==='협의중') return '조건 조율 마무리 — 담당자 통화';
  if(c.kind==='신규' && !c.lastContact) return '첫 접촉: 회사 대표번호로 검진 제안';
  if(c.lastContact) return '최종 연락 '+c.lastContact+' — 후속 확인';
  if(c.status==='실패') return '보류 — 다음 분기 재검토';
  return '담당자 연락처 확보 후 제안';
}

/* ---------- render ---------- */
function renderAll(){
  renderTop();
  renderStats();
  renderToday();
  renderCompanies();
  renderSched();
  renderSettings();
  if(S.detailId) renderDetail();
}

function renderTop(){
  var list=todayList();
  var done=companies().filter(isDoneToday).length;
  $('todayHead').innerHTML='지금 확인할 기업'+'<span>'+list.length+'곳</span>';
  var sub;
  if(!S.token && !S.doc){
    sub='<b>연결 필요</b> · 토큰을 넣으면 노션 CRM 195개사가 열립니다';
  } else if(S.doc){
    sub='전체 <b>'+companies().length+'개사</b> · 오늘 완료 <b>'+done+'</b> · '+ (!S.token?'로컬 모드':(S.lastSync? timeAgo(S.lastSync)+' 동기화' : '동기화 전'));
  } else {
    sub='데이터 불러오는 중…';
  }
  $('tbSub').innerHTML=sub;
  var all=companies();
  var link=document.querySelector('#view-today .sec .link');
  if(link) link.textContent='전체 '+all.length+' →';
}

function renderStats(){
  var all=companies();
  var prog=all.filter(function(c){return c.status==='진행'||c.status==='진행💪';}).length;
  var prop=all.filter(function(c){return c.status==='제안 👀';}).length;
  var neu=all.filter(function(c){return c.kind==='신규';}).length;
  var old=all.filter(function(c){return c.kind==='기존';}).length;
  var total=all.reduce(function(a,c){return a+(c.expectedValue||0);},0);
  $('stats').innerHTML=
    '<div class="stat g"><div class="stat-l">진행</div><div class="stat-v">'+prog+'</div></div>'+
    '<div class="stat y"><div class="stat-l">제안 👀</div><div class="stat-v">'+prop+'</div></div>'+
    '<div class="stat c"><div class="stat-l">신규</div><div class="stat-v">'+neu+'</div></div>'+
    '<div class="stat m"><div class="stat-l">기존</div><div class="stat-v">'+old+'</div></div>';
}

function tagHtml(c){
  var out='';
  if(c.priority==='높음') out+='<span class="tag t-red">높음</span>';
  else if(c.priority==='중간') out+='<span class="tag t-yellow">중간</span>';
  var st=c.status||'진행';
  if(st==='제안 👀') out+='<span class="tag t-yellow">제안 👀</span>';
  else if(st==='실패') out+='<span class="tag t-red">실패</span>';
  else if(st==='협의중') out+='<span class="tag t-green">협의중</span>';
  else out+='<span class="tag t-cyan">'+esc(st)+'</span>';
  if(c.kind) out+='<span class="tag t-muted">'+esc(c.kind)+'</span>';
  if(isDoneToday(c)) out+='<span class="tag t-green">✓ 오늘 완료</span>';
  if(isOverdue(c)) out+='<span class="tag t-red">밀림</span>';
  return '<div class="tags">'+out+'</div>';
}

function cardHtml(c){
  var sum=[];
  if(c.headcountText) sum.push(esc(c.headcountText));
  if(c.expectedValue) sum.push('예상 '+won(c.expectedValue));
  if(c.lastContact) sum.push('연락 '+esc(c.lastContact));
  var loc=c.address||'';
  return '<div class="card'+(isDoneToday(c)?' done':'')+'" data-id="'+esc(c.id)+'">'+
    '<div class="c-top" onclick="openDetail(\''+esc(c.id)+'\')">'+
      '<div class="avatar '+(c.kind==='신규'?'new':'keep')+'">'+esc(firstChar(c.name))+'</div>'+
      '<div class="c-mid">'+
        '<div class="c-name"><span class="nm">'+esc(shortName(c.name))+'</span></div>'+
        tagHtml(c)+
        '<div class="c-sum">'+sum.join(' <em>·</em> ')+'</div>'+
        (loc?'<div class="c-loc">📍 '+esc(loc)+'</div>':'')+
      '</div>'+
    '</div>'+
    '<div class="c-acts">'+
      '<button class="btn done" onclick="actDone(\''+esc(c.id)+'\')">✓ 완료</button>'+
      '<button class="btn snooze" onclick="actSnooze(\''+esc(c.id)+'\')">🕒 내일로</button>'+
      '<button class="btn open" onclick="openDetail(\''+esc(c.id)+'\')">상세 ›</button>'+
    '</div>'+
  '</div>';
}

function emptyHtml(ic, h, p){
  return '<div class="empty"><div class="ic">'+ic+'</div><h3>'+h+'</h3><p>'+p+'</p></div>';
}

function renderToday(){
  var box=$('todayList');
  if(!S.token && !S.doc){
    box.innerHTML=emptyHtml('🔗','아직 연결되지 않았습니다','GitHub 토큰을 한 번 넣으면 노션 CRM 195개사가 이 화면에 그대로 열리고, 완료·내일로·메모가 비공개 저장소에 바로 저장됩니다.')+
      '<button class="btnwide" style="margin-top:12px" onclick="connectFlow()">토큰 연결하기</button>';
    $('moreBtn').style.display='none';
    return;
  }
  var list=todayList().filter(function(c){return match(c,S.q);});
  var show=list.slice(0,S.todayLimit);
  if(!list.length){
    box.innerHTML=emptyHtml('🎉','오늘 처리할 기업이 없습니다', S.q?'검색 결과가 없습니다. 다른 키워드로 찾아보세요.':'완료·내일로 넘긴 기업은 내일 다시 올라옵니다.');
    $('moreBtn').style.display='none';
    return;
  }
  box.innerHTML=show.map(cardHtml).join('');
  var more=list.length-show.length;
  var mb=$('moreBtn');
  if(more>0){ mb.style.display='block'; mb.textContent='나머지 '+more+'곳 더 보기'; }
  else mb.style.display='none';
}
function moreToday(){ S.todayLimit+=15; renderToday(); }

function renderCompanies(){
  var chips=[['all','전체'],['new','신규'],['old','기존'],['high','우선순위 높음'],['prop','제안'],['due','일정 있음']];
  $('chips').innerHTML=chips.map(function(p){
    return '<button class="chip'+(S.filter===p[0]?' on':'')+'" onclick="setFilter(\''+p[0]+'\')">'+p[1]+'</button>';
  }).join('');

  var arr=companies().slice().sort(function(a,b){return (b.expectedValue||0)-(a.expectedValue||0);});
  if(S.filter==='new') arr=arr.filter(function(c){return c.kind==='신규';});
  if(S.filter==='old') arr=arr.filter(function(c){return c.kind==='기존';});
  if(S.filter==='high') arr=arr.filter(function(c){return c.priority==='높음';});
  if(S.filter==='prop') arr=arr.filter(function(c){return c.status==='제안 👀';});
  if(S.filter==='due') arr=arr.filter(function(c){return !!c.dueDate;});
  arr=arr.filter(function(c){return match(c,S.q);});

  var box=$('compList'), mb=$('moreBtn2');
  if(!S.token && !S.doc){ box.innerHTML=''; mb.style.display='none'; return; }
  if(!arr.length){ box.innerHTML=emptyHtml('🔍','해당하는 기업이 없습니다','검색어나 필터를 바꿔 보세요.'); mb.style.display='none'; return; }
  box.innerHTML=arr.slice(0,S.compLimit).map(cardHtml).join('');
  var more=arr.length-Math.min(arr.length,S.compLimit);
  if(more>0){ mb.style.display='block'; mb.textContent='나머지 '+more+'곳 더 보기'; } else mb.style.display='none';
}

function renderSched(){
  var box=$('schedList');
  if(!S.token && !S.doc){ box.innerHTML=emptyHtml('📅','연결하면 일정이 보입니다',''); return; }
  var today=todayStr();
  var groups={};
  companies().forEach(function(c){
    if(!c.dueDate) return;
    if(c.doneAt && c.doneAt>=c.dueDate) return;
    var d=c.dueDate;
    (groups[d]=groups[d]||[]).push(c);
  });
  var keys=Object.keys(groups).sort();
  var doneToday=companies().filter(isDoneToday);
  var html='';
  var cnt=keys.reduce(function(a,k){return a+groups[k].length;},0);
  $('schedCount').textContent='예정 '+cnt+'곳';
  if(!keys.length && !doneToday.length){
    box.innerHTML=emptyHtml('🕒','예정된 일정이 없습니다','카드의 <b>🕒 내일로</b>를 누르면 다음 날 일정으로 넘어가고, 여기에 날짜별로 모입니다.');
    return;
  }
  keys.forEach(function(k){
    var over=k<today;
    html+='<div class="sched-group"><div class="sched-date">'+(over?'🔴 ':'📅 ')+dayLabel(k)+' · '+k+' <span style="color:var(--muted);font-weight:500">('+groups[k].length+')</span></div>'+
      '<div class="list">'+groups[k].sort(function(a,b){return score(b)-score(a);}).map(cardHtml).join('')+'</div></div>';
  });
  if(doneToday.length){
    html+='<div class="sched-group"><div class="sched-date" style="color:var(--green)">✓ 오늘 완료 ('+doneToday.length+')</div><div class="list">'+
      doneToday.map(cardHtml).join('')+'</div></div>';
  }
  box.innerHTML=html;
}
function clearSched(){
  if(!confirm('밀린 일정(오늘 이전 날짜)을 모두 오늘로 당길까요?')) return;
  var t=todayStr(), n=0;
  companies().forEach(function(c){
    if(c.dueDate && c.dueDate<t && !c.doneAt){ c.dueDate=''; n++; }
  });
  if(n){ markDirty(); commit('reset','밀린 일정 '+n+'건 오늘로'); }
  renderAll();
}

/* ---------- mutations ---------- */
function markDirty(){ S.doc.updatedAt=new Date().toISOString(); }

function actDone(id){
  var c=byId(id); if(!c) return;
  var prev={doneAt:c.doneAt, dueDate:c.dueDate};
  c.doneAt=todayStr(); c.dueDate='';
  logAct(c,'완료 처리');
  markDirty(); saveLocal(); renderAll();
  commit('done', id);
  toast(shortName(c.name)+' 완료'+(S.token?'':' · 이 기기에만'), function(){ c.doneAt=prev.doneAt; c.dueDate=prev.dueDate; c.activity=c.activity.filter(function(a){return a.text!=='완료 처리';}); markDirty(); saveLocal(); renderAll(); commit('undo','실행취소'); }, 'done', id);
}
function actSnooze(id){
  var c=byId(id); if(!c) return;
  var prev={dueDate:c.dueDate, doneAt:c.doneAt};
  c.dueDate=addDays(1); c.doneAt='';
  logAct(c,'내일로 이동');
  markDirty(); saveLocal(); renderAll();
  commit('snooze', id);
  toast(shortName(c.name)+' → 내일'+(S.token?'':' · 이 기기에만'), function(){ c.dueDate=prev.dueDate; c.doneAt=prev.doneAt; c.activity=c.activity.filter(function(a){return a.text!=='내일로 이동';}); markDirty(); saveLocal(); renderAll(); commit('undo','실행취소'); }, 'snooze', id);
}
function logAct(c, text, type){
  c.activity=c.activity||[];
  c.activity.unshift({ t:new Date().toISOString(), text:text, type:type||'note' });
  if(c.activity.length>60) c.activity=c.activity.slice(0,60);
}
function applyOp(doc, op, args){
  var c=(doc.companies||[]).filter(function(x){return x.id===args;})[0];
  if(op==='done' && c){ c.doneAt=todayStr(); c.dueDate=''; }
  else if(op==='snooze' && c){ c.dueDate=addDays(1); c.doneAt=''; }
  else if(op==='undo'){ /* reconcile by refetch; nothing to add */ }
  else if(op==='reset'){ }
  return doc;
}
function commit(op, id){
  enqueue(op, id);
}

      '2. Token name 아무거나, Expiration 은 원하는 기간(예: 1년)<br>'+
      '3. <b>Repository access</b> → Only select repositories → <b>'+esc(S.repo.repo)+'</b> 만 선택<br>'+
      '4. <b>Permissions</b> → Repository permissions → <b>Contents: Read and write</b> 하나만 설정<br>'+
      '5. Generate token → 나온 <b>github_pat_…</b> 를 위에 붙여넣기'+
    '</div>'+
    '<a class="btnwide alt" style="display:block;text-align:center;text-decoration:none;margin-top:14px" href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">토큰 발급 페이지열기 ↗</a>';
  document.body.classList.add('noscroll');
  $('veil').classList.add('on');
  $('tokenSheet').classList.add('on');
}
async function saveToken(){
  var v=($('tokIn').value||'').trim();
  if(!v){ toast('토큰을 입력해 주세요'); return; }
  var prev=S.token; S.token=v;
  setSync('sync');
  try{
    var got=await ghGetFile();
    S.doc=got.json; S.sha=got.sha; S.lastSync=new Date().toISOString();
    try{ localStorage.setItem(K.token,v); }catch(e){}
    saveLocal(); closeSheets(); setSync('ok'); renderAll();
    toast('연결 완료 · '+companies().length+'개사');
  }catch(err){
    if(err.status===404){
      var hasData=!!(S.doc && S.doc.companies && S.doc.companies.length);
      var ok=confirm('저장소에 '+S.repo.path+' 파일이 없습니다.\n\n지금 이 기기의 데이터('+(hasData?S.doc.companies.length+'개사':'빈 데이터')+')로 파일을 새로 만들까요?');
      if(ok){
        try{
          S.doc=S.doc||{schema:2,title:'2026 영업 CRM',updatedAt:new Date().toISOString(),companies:[]};
          var sha=await ghPutFile(S.doc,null,'CRM 데이터 생성');
          S.sha=sha; S.lastSync=new Date().toISOString();
          try{ localStorage.setItem(K.token,v); }catch(e){}
          saveLocal(); closeSheets(); setSync('ok'); renderAll();
          toast('파일을 만들었습니다 · '+companies().length+'개사');
          return;
        }catch(err2){ err=err2; }
      } else { S.token=prev; setSync('idle'); return; }
    }
    S.token=prev;
    setSync('err', err.message);
    toast('연결 실패: '+err.message);
  }
}
function disconnect(){
  if(!confirm('토큰을 삭제하고 연결을 해제할까요? (저장된 데이터는 이 기기에 남습니다)')) return;
  S.token=''; try{ localStorage.removeItem(K.token); }catch(e){}
  setSync('idle'); renderAll(); toast('연결을 해제했습니다');
}
function openRepoEdit(){
  openEdit('저장소 주소',
    '<div class="field"><label>owner</label><input class="input" id="r-owner" value="'+esc(S.repo.owner)+'"></div>'+
    '<div class="field"><label>repository</label><input class="input" id="r-repo" value="'+esc(S.repo.repo)+'"></div>'+
    '<div class="field"><label>file path</label><input class="input" id="r-path" value="'+esc(S.repo.path)+'"></div>'+
    '<div class="field"><label>branch</label><input class="input" id="r-branch" value="'+esc(S.repo.branch)+'"></div>'+
    '<button class="btnwide" onclick="saveRepo()">저장 후 새로고침</button>');
}
function saveRepo(){
  S.repo={ owner:$('r-owner').value.trim(), repo:$('r-repo').value.trim(), path:$('r-path').value.trim()||'crm-data.json', branch:$('r-branch').value.trim()||'main' };
  try{ localStorage.setItem(K.repo, JSON.stringify(S.repo)); }catch(e){}
  closeSheets(); pullNow();
}

/* ---------- backup ---------- */
function exportJson(){
  if(!S.doc){ toast('데이터가 없습니다'); return; }
  var blob=new Blob([JSON.stringify(S.doc,null,1)],{type:'application/json'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='crm-data-'+todayStr()+'.json';
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); },4000);
  toast('파일로 내려받았습니다');
}
function importJson(input){
  var f=input.files && input.files[0];
  if(!f) return;
  var rd=new FileReader();
  rd.onload=function(){
    try{
      var d=JSON.parse(rd.result);
      if(!d.companies || !d.companies.length) throw new Error('companies 배열이 없습니다');
      if(S.doc && !confirm('현재 데이터를 이 파일로 바꿉니다. 계속할까요?')) return;
      S.doc=d; markDirty(); saveLocal(); renderAll();
      toast('불러왔습니다 · '+d.companies.length+'개사 (저장은 다음 수정 때)');
    }catch(e){ toast('읽기 실패: '+e.message); }
  };
  rd.readAsText(f);
  input.value='';
}

/* ---------- tabs / search ---------- */
function setTab(t){
  S.tab=t;
  ['today','companies','sched','settings'].forEach(function(x){
    var el=$('view-'+x); if(el) el.style.display = (x===t?'block':'none');
  });
  document.querySelectorAll('.tab').forEach(function(b){
    b.classList.toggle('on', b.getAttribute('data-tab')===t);
  });
  window.scrollTo(0,0);
  if(t==='settings') renderSettings();
  if(t==='sched') renderSched();
}
function clearQ(){
  S.q=''; $('q').value=''; $('q2').value='';
  $('clearq').style.display='none'; $('clearq2').style.display='none';
  renderToday(); renderCompanies();
}
function bindSearch(){
  ['q','q2'].forEach(function(id){
    var el=$(id);
    el.addEventListener('input', function(){
      S.q=el.value.trim();
      var other=id==='q'?'q2':'q';
      if($(other).value!==el.value) $(other).value=el.value;
      $('clearq').style.display=S.q?'block':'none';
      $('clearq2').style.display=S.q?'block':'none';
      S.todayLimit=10; S.compLimit=40;
      renderToday(); renderCompanies();
    });
  });
}

/* ---------- toast ---------- */
var toastTimer=null, undoCb=null;
function toast(msg, cb, kind, id){
  $('toastMsg').textContent=msg;
  undoCb=cb||null;
  $('toastUndo').style.display=cb?'block':'none';
  $('toast').classList.add('on');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){ $('toast').classList.remove('on'); undoCb=null; }, cb?4200:2200);
}
$('toastUndo').addEventListener('click', function(){
  if(undoCb){ var f=undoCb; undoCb=null; $('toast').classList.remove('on'); f(); }
});

/* ---------- boot ---------- */
function boot(){
  loadLocal();
  bindSearch();
  renderAll();
  if(S.token){
    if(S.doc){ setSync('ok'); pullNow(); }
    else { setSync('sync'); pullNow(); }
  } else {
    setSync('idle');
    if(S.doc) renderAll();
  }
  window.addEventListener('online', function(){ if(S.token && queue.length){ schedulePush(300); } });
  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState==='visible' && S.token && S.doc && (!S.lastSync || Date.now()-new Date(S.lastSync).getTime()>180000)){
      // refresh quietly when coming back after a while
      ghGetFile().then(function(g){
        if(queue.length) return; // don't clobber unsaved local edits
        S.doc=g.json; S.sha=g.sha; S.lastSync=new Date().toISOString(); saveLocal(); setSync('ok'); renderAll();
      }).catch(function(){});
    }
  });
}
boot();
</script>
